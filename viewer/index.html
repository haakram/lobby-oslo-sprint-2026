<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Shift viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%275%27 fill=%27%23ffb54a%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<main class="app">
  <section class="stage" aria-label="Hotel model">
    <canvas id="scene"></canvas>
    <div class="floors" role="group" aria-label="Floors">
      <button data-floor="0" class="on">All</button>
      <button data-floor="3">3</button>
      <button data-floor="2">2</button>
      <button data-floor="1">1</button>
    </div>
    <div class="empty" id="empty" hidden>
      <p>No shifts yet — run <code>python -m agent run --seed 1</code></p>
    </div>
    <div class="deck" id="deck">
      <button id="play" aria-label="Play or pause">Pause</button>
      <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Replay position">
      <span id="pos" class="num">0/0</span>
      <label class="speed">Speed
        <select id="speed" aria-label="Playback speed">
          <option>1</option><option>2</option><option>5</option><option>10</option><option>20</option>
        </select>
      </label>
      <button id="liveBtn" title="Jump to the newest line">Live</button>
    </div>
  </section>

  <aside class="panel" aria-label="Shift status">
    <header>
      <h1>Night Shift</h1>
      <div class="pick">
        <select id="runs" aria-label="Run"></select>
        <span id="badge" class="badge">idle</span>
      </div>
    </header>

    <div class="hero">
      <div class="score"><span id="score" class="num">0</span><small>points</small></div>
      <div class="clock"><span id="clock" class="num">0:00</span><small>shift clock</small></div>
    </div>

    <dl class="vitals">
      <div class="battery"><dt>Battery</dt>
        <dd><span class="bar"><i id="batfill"></i></span><span id="bat" class="num">-</span></dd></div>
      <div><dt>Hands</dt><dd id="hands">empty</dd></div>
      <div><dt>Cart</dt><dd id="cart">empty</dd></div>
      <div><dt>At</dt><dd id="where">-</dd></div>
    </dl>

    <section class="now">
      <h2>Current task</h2>
      <p id="task" class="task">Waiting for the shift to start</p>
      <ul id="queue" class="queue"></ul>
    </section>

    <section class="feed">
      <h2>Decisions and events</h2>
      <ol id="log"></ol>
    </section>
  </aside>
</main>
<script type="module" src="/static/app.js"></script>
</body>
</html>
